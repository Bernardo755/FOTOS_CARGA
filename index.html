<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gestor de Fotografías</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #1f2937;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

.header {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    background: #e5e7eb;
    font-weight: 600;
}

.tab.active {
    background: #2563eb;
    color: white;
}

.module {
    display: none;
}

.module.active {
    display: block;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card h2 {
    margin-top: 0;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

input[type="text"],
input[type="password"],
input[type="date"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.upload-box {
    margin-top: 20px;
    border: 2px dashed #cbd5e1;
    border-radius: 14px;
    padding: 25px;
    text-align: center;
    background: #f8fafc;
}

.upload-btn {
    display: flex;
    width: max-content;
    min-width: 210px;
    justify-content: center;
    align-items: center;
    margin: 10px auto;
    padding: 12px 20px;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.upload-btn:hover {
    opacity: .9;
}

input[type="file"] {
    display: none;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 17px;
    cursor: pointer;
    font-weight: 600;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-success {
    background: #16a34a;
    color: white;
}

.btn-danger {
    background: #dc2626;
    color: white;
}

.btn-secondary {
    background: #e5e7eb;
    color: #1f2937;
}

.photo-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

/* =========================================================
   FOTOGRAFÍAS ARRASTRABLES
   ========================================================= */

.photo-card {
    position: relative;
    background: white;
    border-radius: 13px;
    overflow: hidden;
    border: 2px solid transparent;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    cursor: grab;
    transition:
        transform .15s ease,
        opacity .15s ease,
        border-color .15s ease;
}

.photo-card:active {
    cursor: grabbing;
}

.photo-card.dragging {
    opacity: .45;
    transform: scale(.97);
    border-color: #2563eb;
}

.photo-card.drag-over {
    border-color: #14b8a6;
    transform: scale(1.02);
}

.photo-card img {
    display: block;
    width: 100%;
    height: 170px;
    object-fit: cover;
}

.photo-number {
    position: absolute;
    top: 8px;
    left: 8px;
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #2563eb;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    z-index: 2;
}

.photo-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    background: #dc2626;
    color: white;
    z-index: 3;
}

.photo-name {
    padding: 9px;
    font-size: 12px;
    word-break: break-word;
}

.drop-help {
    margin-top: 10px;
    color: #64748b;
    font-size: 13px;
}

.pdf-list {
    margin-top: 15px;
}

.pdf-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding: 12px;
    margin-bottom: 8px;
    background: #f8fafc;
    border-radius: 10px;
}

.pdf-info {
    min-width: 0;
}

.pdf-name {
    font-weight: 600;
    word-break: break-word;
}

.pdf-size {
    color: #64748b;
    font-size: 12px;
}

.login-box {
    max-width: 420px;
    margin: 40px auto;
}

.hidden {
    display: none !important;
}

.loading {
    text-align: center;
    padding: 25px;
}

.status {
    padding: 12px;
    border-radius: 9px;
    margin-top: 15px;
    display: none;
}

.status.ok {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
}

th {
    background: #f8fafc;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    background: #e0f2fe;
    color: #0369a1;
    font-size: 12px;
    font-weight: 600;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;
    border-radius: 16px;
    max-width: 1000px;
    width: 100%;
    max-height: 90vh;
    overflow: auto;
    padding: 20px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.modal-header h3 {
    margin: 0;
}

.modal-close {
    background: #e5e7eb;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    padding: 0;
}

.modal-image {
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    margin-top: 15px;
}

.selection-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.folder-link {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}

.folder-link:hover {
    text-decoration: underline;
}

@media(max-width:700px) {

    .container {
        padding: 12px;
    }

    .tabs {
        flex-direction: column;
    }

    .photo-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }

    .photo-card img {
        height: 130px;
    }

    .pdf-item {
        flex-direction: column;
        align-items: flex-start;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Gestor de Fotografías</h1>

    </div>


    <!-- =====================================================
         TABS
         ===================================================== -->

    <div class="tabs">

        <button
            class="tab active"
            id="tabCarga"
            onclick="mostrarModulo('carga')">

            Nueva carga

        </button>

        <button
            class="tab"
            id="tabGestor"
            onclick="entrarGestor()">

            Gestor

        </button>

    </div>


    <!-- =====================================================
         MÓDULO 1
         ===================================================== -->

    <div
        id="moduloCarga"
        class="module active">

        <div class="card">

            <h2>Nueva carga</h2>

            <div class="form-grid">

                <div>

                    <label>
                        Título / Nombre
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        placeholder="13UBH0007A_EMS_CARTELES_OCTUBRE2026">

                </div>

                <div>

                    <label>
                        Cargador
                    </label>

                    <input
                        type="text"
                        id="cargador"
                        placeholder="JULIO CESAR ZARATE DE LA FUENTE">

                </div>

            </div>


            <!-- =================================================
                 FOTOGRAFÍAS
                 ================================================= -->

            <div class="upload-box">

                <div>
                    Fotografías
                </div>

                <label
                    for="inputFotos"
                    class="upload-btn">

                    Seleccionar fotografías

                </label>

                <input
                    type="file"
                    id="inputFotos"
                    accept="image/*"
                    multiple>

                <div class="drop-help">

                    Puedes seleccionar varias fotografías.
                    Después puedes
                    <strong>arrastrarlas para cambiar el orden</strong>.

                </div>

            </div>


            <div
                id="contadorFotos"
                class="drop-help">

                0 fotografías seleccionadas

            </div>


            <div
                id="gridFotos"
                class="photo-grid">

            </div>


            <!-- =================================================
                 ACTAS
                 ================================================= -->

            <div class="upload-box">

                <div>
                    Actas (PDF)
                </div>

                <label
                    for="inputActas"
                    class="upload-btn">

                    Seleccionar actas

                </label>

                <input
                    type="file"
                    id="inputActas"
                    accept="application/pdf"
                    multiple>

                <div
                    class="drop-help">

                    Este apartado es opcional.

                </div>

            </div>


            <div
                id="listaActas"
                class="pdf-list">

            </div>


            <!-- =================================================
                 LISTAS
                 ================================================= -->

            <div class="upload-box">

                <div>
                    Listas (PDF)
                </div>

                <label
                    for="inputListas"
                    class="upload-btn">

                    Seleccionar listas

                </label>

                <input
                    type="file"
                    id="inputListas"
                    accept="application/pdf"
                    multiple>

                <div
                    class="drop-help">

                    Este apartado es opcional.

                </div>

            </div>


            <div
                id="listaListas"
                class="pdf-list">

            </div>


            <div class="actions">

                <button
                    class="btn-success"
                    onclick="guardarCarga()">

                    Guardar carga

                </button>

                <button
                    class="btn-secondary"
                    onclick="limpiarCarga()">

                    Limpiar

                </button>

            </div>


            <div
                id="statusCarga"
                class="status">

            </div>

        </div>

    </div>


    <!-- =====================================================
         MÓDULO 2
         ===================================================== -->

    <div
        id="moduloGestor"
        class="module">

        <div
            id="loginBox"
            class="card login-box">

            <h2>Acceso al Gestor</h2>

            <label>
                Contraseña
            </label>

            <input
                type="password"
                id="password">

            <div class="actions">

                <button
                    class="btn-primary"
                    onclick="iniciarSesion()">

                    Entrar

                </button>

            </div>

            <div
                id="statusLogin"
                class="status">

            </div>

        </div>


        <div
            id="gestorContenido"
            class="hidden">


            <!-- =================================================
                 BÚSQUEDA
                 ================================================= -->

            <div class="card">

                <h2>Buscar cargas</h2>

                <div class="form-grid">

                    <div>

                        <label>
                            Título
                        </label>

                        <input
                            type="text"
                            id="filtroTitulo"
                            placeholder="Buscar por título">

                    </div>

                    <div>

                        <label>
                            Fecha
                        </label>

                        <input
                            type="date"
                            id="filtroFecha">

                    </div>

                    <div>

                        <label>
                            Cargador
                        </label>

                        <input
                            type="text"
                            id="filtroCargador"
                            placeholder="Buscar cargador">

                    </div>

                </div>

                <div class="actions">

                    <button
                        class="btn-primary"
                        onclick="buscarCargas()">

                        Buscar

                    </button>

                    <button
                        class="btn-secondary"
                        onclick="limpiarFiltros()">

                        Limpiar filtros

                    </button>

                    <button
                        class="btn-danger"
                        onclick="cerrarSesion()">

                        Cerrar sesión

                    </button>
<button
    class="btn-success"
    onclick="buscarCargas()">

    Actualizar

</button>
                </div>

            </div>


            <!-- =================================================
                 RESULTADOS
                 ================================================= -->

            <div class="card">

                <h2>Registros</h2>

                <div
                    id="tablaCargas"
                    class="table-wrap">

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    id="modal"
    class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h3 id="modalTitulo">
                Archivos
            </h3>

            <button
                class="modal-close"
                onclick="cerrarModal()">

                ×

            </button>

        </div>

        <div
            id="modalContenido">

        </div>

    </div>

</div>


<script>


// ============================================================
// CONFIGURACIÓN
// ============================================================

const SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycbzxymra5NbtdLBq9yEm5aKjWxEI5E3KieBjse5ZoAhYhaSQVIsIPX3DzM7604Q_PyMs/exec';


// ============================================================
// VARIABLES
// ============================================================

let token =
    sessionStorage.getItem(
        'GESTOR_TOKEN'
    ) || '';

let fotosSeleccionadas = [];

let actasSeleccionadas = [];

let listasSeleccionadas = [];

let cargaActual = null;


// ============================================================
// PETICIÓN AL SERVIDOR
// ============================================================

async function api(
    datos
) {

    const respuesta =
        await fetch(
            SCRIPT_URL,
            {
                method: 'POST',
                body: JSON.stringify(datos)
            }
        );

    const resultado =
        await respuesta.json();

    if (
        resultado.ok === false
    ) {

        throw new Error(
            resultado.error ||
            'Ocurrió un error.'
        );
    }

    return resultado;
}


// ============================================================
// CAMBIAR MÓDULO
// ============================================================

function mostrarModulo(
    modulo
) {

    document
        .querySelectorAll('.module')
        .forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );

    document
        .querySelectorAll('.tab')
        .forEach(
            el =>
                el.classList.remove(
                    'active'
                )
        );

    if (
        modulo === 'carga'
    ) {

        document
            .getElementById(
                'moduloCarga'
            )
            .classList.add(
                'active'
            );

        document
            .getElementById(
                'tabCarga'
            )
            .classList.add(
                'active'
            );

        return;
    }

    document
        .getElementById(
            'moduloGestor'
        )
        .classList.add(
            'active'
        );

    document
        .getElementById(
            'tabGestor'
        )
        .classList.add(
            'active'
        );
}


// ============================================================
// ENTRAR AL GESTOR
// ============================================================

function entrarGestor() {

    mostrarModulo(
        'gestor'
    );

    if (token) {

        document
            .getElementById(
                'loginBox'
            )
            .classList.add(
                'hidden'
            );

        document
            .getElementById(
                'gestorContenido'
            )
            .classList.remove(
                'hidden'
            );

        buscarCargas();

    } else {

        document
            .getElementById(
                'loginBox'
            )
            .classList.remove(
                'hidden'
            );

        document
            .getElementById(
                'gestorContenido'
            )
            .classList.add(
                'hidden'
            );
    }
}


// ============================================================
// LOGIN
// ============================================================

async function iniciarSesion() {

    const password =
        document
            .getElementById(
                'password'
            )
            .value;

    try {

        const resultado =
            await api({
                accion: 'login',
                password: password
            });

        token =
            resultado.token;

        sessionStorage.setItem(
            'GESTOR_TOKEN',
            token
        );

        document
            .getElementById(
                'loginBox'
            )
            .classList.add(
                'hidden'
            );

        document
            .getElementById(
                'gestorContenido'
            )
            .classList.remove(
                'hidden'
            );

        document
            .getElementById(
                'statusLogin'
            )
            .className =
            'status';

        buscarCargas();

    } catch (error) {

        mostrarStatus(
            'statusLogin',
            error.message,
            false
        );
    }
}


// ============================================================
// LOGOUT
// ============================================================

async function cerrarSesion() {

    try {

        if (token) {

            await api({
                accion: 'logout',
                token: token
            });
        }

    } catch (e) {}

    token = '';

    sessionStorage.removeItem(
        'GESTOR_TOKEN'
    );

    document
        .getElementById(
            'gestorContenido'
        )
        .classList.add(
            'hidden'
        );

    document
        .getElementById(
            'loginBox'
        )
        .classList.remove(
            'hidden'
        );

    document
        .getElementById(
            'password'
        )
        .value = '';
}


// ============================================================
// FOTOGRAFÍAS
// ============================================================

document
    .getElementById(
        'inputFotos'
    )
    .addEventListener(
        'change',
        function(e) {

            const archivos =
                Array.from(
                    e.target.files
                );

            archivos.forEach(
                function(archivo) {

                    fotosSeleccionadas.push(
                        archivo
                    );
                }
            );

            renderizarFotos();

            e.target.value = '';

        }
    );


// ============================================================
// RENDERIZAR FOTOS
// ============================================================

function renderizarFotos() {

    const contenedor =
        document.getElementById(
            'gridFotos'
        );

    contenedor.innerHTML = '';

    fotosSeleccionadas.forEach(
        function(
            archivo,
            index
        ) {

            const card =
                document.createElement(
                    'div'
                );

            card.className =
                'photo-card';

            card.draggable = true;

            card.dataset.index =
                index;


            // ------------------------------------------------
            // DRAG START
            // ------------------------------------------------

            card.addEventListener(
                'dragstart',
                function(e) {

                    card.classList.add(
                        'dragging'
                    );

                    e.dataTransfer.effectAllowed =
                        'move';

                    e.dataTransfer.setData(
                        'text/plain',
                        String(index)
                    );
                }
            );


            // ------------------------------------------------
            // DRAG END
            // ------------------------------------------------

            card.addEventListener(
                'dragend',
                function() {

                    card.classList.remove(
                        'dragging'
                    );

                    document
                        .querySelectorAll(
                            '.photo-card'
                        )
                        .forEach(
                            el => {

                                el.classList.remove(
                                    'drag-over'
                                );
                            }
                        );
                }
            );


            // ------------------------------------------------
            // DRAG OVER
            // ------------------------------------------------

            card.addEventListener(
                'dragover',
                function(e) {

                    e.preventDefault();

                    e.dataTransfer.dropEffect =
                        'move';

                    card.classList.add(
                        'drag-over'
                    );
                }
            );


            // ------------------------------------------------
            // DRAG LEAVE
            // ------------------------------------------------

            card.addEventListener(
                'dragleave',
                function() {

                    card.classList.remove(
                        'drag-over'
                    );
                }
            );


            // ------------------------------------------------
            // DROP
            // ------------------------------------------------

            card.addEventListener(
                'drop',
                function(e) {

                    e.preventDefault();

                    card.classList.remove(
                        'drag-over'
                    );

                    const origen =
                        Number(
                            e.dataTransfer.getData(
                                'text/plain'
                            )
                        );

                    const destino =
                        Number(
                            card.dataset.index
                        );

                    if (
                        origen === destino ||
                        isNaN(origen) ||
                        isNaN(destino)
                    ) {
                        return;
                    }

                    const elemento =
                        fotosSeleccionadas.splice(
                            origen,
                            1
                        )[0];

                    fotosSeleccionadas.splice(
                        destino,
                        0,
                        elemento
                    );

                    renderizarFotos();
                }
            );


            // ------------------------------------------------
            // NUMERO
            // ------------------------------------------------

            const numero =
                document.createElement(
                    'div'
                );

            numero.className =
                'photo-number';

            numero.textContent =
                index + 1;


            // ------------------------------------------------
            // IMAGEN
            // ------------------------------------------------

            const img =
                document.createElement(
                    'img'
                );

            img.alt =
                archivo.name;

            const reader =
                new FileReader();

            reader.onload =
                function(event) {

                    img.src =
                        event.target.result;
                };

            reader.readAsDataURL(
                archivo
            );


            // ------------------------------------------------
            // BOTÓN ELIMINAR
            // ------------------------------------------------

            const eliminar =
                document.createElement(
                    'button'
                );

            eliminar.className =
                'photo-delete';

            eliminar.type =
                'button';

            eliminar.textContent =
                '×';

            eliminar.title =
                'Eliminar fotografía';

            eliminar.addEventListener(
                'click',
                function(e) {

                    e.preventDefault();

                    e.stopPropagation();

                    fotosSeleccionadas.splice(
                        index,
                        1
                    );

                    renderizarFotos();
                }
            );


            // ------------------------------------------------
            // NOMBRE
            // ------------------------------------------------

            const nombre =
                document.createElement(
                    'div'
                );

            nombre.className =
                'photo-name';

            nombre.textContent =
                archivo.name;


            card.appendChild(
                numero
            );

            card.appendChild(
                img
            );

            card.appendChild(
                eliminar
            );

            card.appendChild(
                nombre
            );

            contenedor.appendChild(
                card
            );
        }
    );


    document
        .getElementById(
            'contadorFotos'
        )
        .textContent =
        fotosSeleccionadas.length +
        (
            fotosSeleccionadas.length === 1

// ============================================================
// GUARDAR CARGA
// ============================================================

async function guardarCarga() {

    const titulo =
        document
            .getElementById(
                'titulo'
            )
            .value
            .trim();

    const cargador =
        document
            .getElementById(
                'cargador'
            )
            .value
            .trim();

    if (!titulo) {

        mostrarStatus(
            'statusCarga',
            'Debes indicar el título o nombre.',
            false
        );

        return;
    }

    if (!cargador) {

        mostrarStatus(
            'statusCarga',
            'Debes indicar quién realiza la carga.',
            false
        );

        return;
    }

    if (
        fotosSeleccionadas.length === 0 &&
        actasSeleccionadas.length === 0 &&
        listasSeleccionadas.length === 0
    ) {

        mostrarStatus(
            'statusCarga',
            'Debes seleccionar al menos una fotografía, acta o lista.',
            false
        );

        return;
    }


    try {

        mostrarStatus(
            'statusCarga',
            'Creando carga...',
            true
        );


        // ------------------------------------------------------
        // CREAR CARPETA
        // ------------------------------------------------------

        const carga =
            await api({
                accion: 'crearCarga',
                titulo: titulo,
                cargador: cargador
            });

        const cargaId =
            carga.cargaId;


        // ------------------------------------------------------
        // SUBIR FOTOGRAFÍAS
        // ------------------------------------------------------

        for (
            let i = 0;
            i < fotosSeleccionadas.length;
            i++
        ) {

            const archivo =
                fotosSeleccionadas[i];

            mostrarStatus(
                'statusCarga',
                'Subiendo fotografía ' +
                (i + 1) +
                ' de ' +
                fotosSeleccionadas.length +
                '...',
                true
            );

            const base64 =
                await archivoABase64(
                    archivo
                );

            const nombre =
                titulo +
                '_' +
                padJS(i + 1, 3) +
                obtenerExtensionJS(
                    archivo.name
                );

            await api({
                accion: 'subirFoto',
                cargaId: cargaId,
                nombre: nombre,
                mimeType:
                    archivo.type ||
                    'image/jpeg',
                base64: base64
            });
        }


        // ------------------------------------------------------
        // SUBIR ACTAS
        // ------------------------------------------------------

        for (
            let i = 0;
            i < actasSeleccionadas.length;
            i++
        ) {

            mostrarStatus(
                'statusCarga',
                'Subiendo acta ' +
                (i + 1) +
                ' de ' +
                actasSeleccionadas.length +
                '...',
                true
            );

            await subirPDFPorBloques(
                cargaId,
                actasSeleccionadas[i],
                'ACTA',
                titulo
            );
        }


        // ------------------------------------------------------
        // SUBIR LISTAS
        // ------------------------------------------------------

        for (
            let i = 0;
            i < listasSeleccionadas.length;
            i++
        ) {

            mostrarStatus(
                'statusCarga',
                'Subiendo lista ' +
                (i + 1) +
                ' de ' +
                listasSeleccionadas.length +
                '...',
                true
            );

            await subirPDFPorBloques(
                cargaId,
                listasSeleccionadas[i],
                'LISTA',
                titulo
            );
        }


        // ------------------------------------------------------
        // FINALIZAR
        // ------------------------------------------------------

        await api({
            accion: 'finalizarCarga',
            cargaId: cargaId
        });

        mostrarStatus(
            'statusCarga',
            'Carga guardada correctamente.',
            true
        );

        limpiarCarga();

    } catch (error) {

        mostrarStatus(
            'statusCarga',
            error.message,
            false
        );
    }
}


// ============================================================
// SUBIR PDF POR BLOQUES
// ============================================================

async function subirPDFPorBloques(
    cargaId,
    archivo,
    tipo,
    titulo
) {

    const inicio =
        await api({
            accion: 'iniciarDocumento',
            cargaId: cargaId,
            tipo: tipo,
            nombre: archivo.name,
            mimeType: 'application/pdf',
            tamano: archivo.size
        });

    const uploadId =
        inicio.uploadId;

    const chunkBytes =
        inicio.chunkBytes ||
        4 * 1024 * 1024;

    let posicion = 0;

    while (
        posicion < archivo.size
    ) {

        const fin =
            Math.min(
                posicion + chunkBytes,
                archivo.size
            ) - 1;

        const blob =
            archivo.slice(
                posicion,
                fin + 1
            );

        const base64 =
            await blobABase64(
                blob
            );

        const resultado =
            await api({
                accion: 'subirChunkDocumento',
                uploadId: uploadId,
                inicio: posicion,
                fin: fin,
                total: archivo.size,
                base64: base64
            });

        if (
            resultado.terminado
        ) {

            break;
        }

        posicion =
            fin + 1;
    }
}


// ============================================================
// ARCHIVO A BASE64
// ============================================================

function archivoABase64(
    archivo
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();

            reader.onload =
                function() {

                    const resultado =
                        reader.result;

                    const base64 =
                        resultado
                            .split(',')[1];

                    resolve(
                        base64
                    );
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                archivo
            );
        }
    );
}


// ============================================================
// BLOB A BASE64
// ============================================================

function blobABase64(
    blob
) {

    return new Promise(
        function(
            resolve,
            reject
        ) {

            const reader =
                new FileReader();

            reader.onload =
                function() {

                    const resultado =
                        reader.result;

                    resolve(
                        resultado
                            .split(',')[1]
                    );
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(
                blob
            );
        }
    );
}

async function buscarCargas() {

    if (!token) {
        return;
    }

    const titulo =
        document
            .getElementById(
                'filtroTitulo'
            )
            .value
            .trim();

    const cargador =
        document
            .getElementById(
                'filtroCargador'
            )
            .value
            .trim();

    const fechaInput =
        document
            .getElementById(
                'filtroFecha'
            )
            .value;

    let fecha = '';

    if (fechaInput) {

        const partes =
            fechaInput.split('-');

        fecha =
            partes[2] +
            '/' +
            partes[1] +
            '/' +
            partes[0];
    }

    const contenedor =
        document.getElementById(
            'tablaCargas'
        );

    contenedor.innerHTML =
        '<div class="loading">Consultando...</div>';

    try {

        const resultado =
            await api({
                accion: 'consultarCargas',
                token: token,
                filtros: {
                    titulo: titulo,
                    fecha: fecha,
                    cargador: cargador
                }
            });

        renderizarTabla(
            resultado.cargas

    } catch (error) {

        contenedor.innerHTML =
            '<div class="status error">' +
            escapeHTML(
                error.message
            ) +
            '</div>';
    }
}

async function cargarMiniatura(

) {

            'foto-' +
            foto.fileId
        );

    if (!contenedor) {
        return;
    }

    try {

        const resultado =
            await api({
                accion:
                    'obtenerFotoBase64',
                token: token,
                folderId:
                    cargaActual.carpetaId,
                fileId:
                    foto.fileId
            });

        const img =
            document.createElement(
                'img'
            );

        img.src =
            'data:' +
            resultado.mimeType +
            ';base64,' +
            resultado.base64;

        img.style.width =
            '100%';

        img.style.height =
            '170px';

        img.style.objectFit =
            'cover';

        img.style.cursor =
            'pointer';

        img.onclick =
            function() {

                cargarFotoModal(
                    foto
                );
            };

        contenedor.replaceWith(
            img
        );

    } catch (error) {

        contenedor.innerHTML =
            'No se pudo cargar';
    }
}

            'Presiona "Actualizar" para ver los cambios en la tabla.'
        );

    } catch (error) {

        alert(
            error.message
        );
    }
}

function mostrarStatus(
    id,
    mensaje,
    correcto
) {

    const elemento =
        document.getElementById(
            id
        );

    elemento.textContent =
        mensaje;

    elemento.className =
        correcto
            ? 'status ok'
            : 'status error';
}


function formatearTamano(
    bytes
) {

    bytes =
        Number(bytes || 0);

    if (bytes < 1024) {
        return bytes + ' B';
    }

    if (bytes < 1024 * 1024) {

        return (
            (bytes / 1024)
                .toFixed(1) +
            ' KB'
        );
    }

    if (
        bytes <
        1024 * 1024 * 1024
    ) {

        return (
            (bytes /
                (1024 * 1024))
                .toFixed(1) +
            ' MB'
        );
    }

    return (
        (bytes /
            (1024 * 1024 * 1024))
            .toFixed(2) +
        ' GB'
    );
}


function obtenerExtensionJS(
    nombre
) {

    const posicion =
        nombre.lastIndexOf('.');

    if (posicion < 0) {
        return '';
    }

    return nombre.substring(
        posicion
    );
}


function padJS(
    numero,
    longitud
) {

    return String(numero)
        .padStart(
            longitud,
            '0'
        );
}


function formatoFechaJS(
    fecha
) {

    if (!fecha) {
        return '';
    }

    const d =
        new Date(fecha);

    if (
        isNaN(
            d.getTime()
        )
    ) {
        return String(fecha);
    }

    return (
        String(
            d.getDate()
        ).padStart(2, '0') +
        '/' +
        String(
            d.getMonth() + 1
        ).padStart(2, '0') +
        '/' +
        d.getFullYear()
    );
}


function escapeHTML(
    texto
) {

    return String(
        texto == null
            ? ''
            : texto
    )
    .replace(
        /&/g,
        '&amp;'
    )
    .replace(
        /</g,
        '&lt;'
    )
    .replace(
        />/g,
        '&gt;'
    )
    .replace(
        /"/g,
        '&quot;'
    )
    .replace(
        /'/g,
        '&#039;'
    );
}
